<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Atmospheric Minimalism: palette, type, components, motion</title><desc id="desc">Original Atmospheric Minimalism concept for ACTOR Agents Arena. Fictional UI copy. Vector mockup, not a Unity screenshot.</desc>
<defs>
<clipPath id="hall-sight"><circle cx="386" cy="349" r="247"/></clipPath>
</defs><g font-family="Arial, Helvetica, sans-serif" font-feature-settings="tnum" stroke-linejoin="round"><rect x="0" y="0" width="1600" height="800" fill="#171F29" rx="0"></rect><text x="38" y="51" font-size="28" fill="#EEE9DC" font-weight="500">ATMOSPHERIC MINIMALISM</text><text x="38" y="81" font-size="15" fill="#B5C0C2" font-weight="400">A quiet station that makes people conspicuous</text><rect x="38" y="114" width="204" height="103" fill="#171F29" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="52" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">VOID</text><text x="52" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#171F29</text><rect x="258" y="114" width="204" height="103" fill="#26343D" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="272" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">INK</text><text x="272" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#26343D</text><rect x="478" y="114" width="204" height="103" fill="#EEE9DC" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="492" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">PAPER</text><text x="492" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#EEE9DC</text><rect x="698" y="114" width="204" height="103" fill="#95B6A4" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="712" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">SAGE</text><text x="712" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#95B6A4</text><rect x="918" y="114" width="204" height="103" fill="#D9947E" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="932" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">CLAY</text><text x="932" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#D9947E</text><rect x="1138" y="114" width="204" height="103" fill="#A7ACC9" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="1152" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">LILAC</text><text x="1152" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#A7ACC9</text><rect x="1358" y="114" width="204" height="103" fill="#E9C781" rx="14" stroke="#65727A" stroke-opacity="0.6"></rect><text x="1372" y="244" font-size="12" fill="#EEE9DC" font-weight="600" letter-spacing="1">SIGNAL</text><text x="1372" y="267" font-size="13" fill="#B5C0C2" font-weight="400">#E9C781</text><text x="38" y="325" font-size="12" fill="#95B6A4" font-weight="600" letter-spacing="1.5">01  TYPOGRAPHY</text><text x="38" y="373" font-size="34" fill="#EEE9DC" font-weight="500">Quiet is not empty.</text><text x="38" y="407" font-size="22" fill="#EEE9DC" font-weight="500">Readable at 800 × 600</text><text x="38" y="441" font-size="15" fill="#B5C0C2" font-weight="400">15px body / 22px line height / 13px essential labels</text><text x="38" y="471" font-size="13" fill="#B5C0C2" font-weight="400">Noto Sans proposed for Latin + Cyrillic. Mockups use system sans.</text><text x="38" y="494" font-size="13" fill="#B5C0C2" font-weight="400">No font binary bundled; glyph and licence QA precede integration.</text><text x="810" y="325" font-size="12" fill="#95B6A4" font-weight="600" letter-spacing="1.5">02  VELLUM COMPONENTS</text><rect x="810" y="355" width="355" height="148" fill="#101A22" rx="16" opacity="0.18"></rect><rect x="810" y="348" width="355" height="148" fill="#24313C" rx="16" fill-opacity="0.95" stroke="#66757D" stroke-opacity="0.48"></rect><line x1="826" y1="349" x2="1149" y2="349" stroke="#B7C4C8" stroke-width="1" opacity="0.25"></line><text x="832" y="381" font-size="18" fill="#EEE9DC" font-weight="600">Connection restored</text><text x="832" y="409" font-size="14" fill="#B5C0C2" font-weight="400">You can return to your own actor.</text><rect x="831" y="431" width="155" height="42" fill="#D9947E" rx="10" stroke-opacity="0.65"></rect><g transform="translate(845 444.0) scale(1)"><path d="M1 8H15M10 3 15 8 10 13" fill="none" stroke="#171F29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="871" y="457.0" font-size="14" fill="#171F29" font-weight="600" text-anchor="start">Resume</text><rect x="1000" y="431" width="143" height="42" fill="#24313C" rx="10" stroke="#5B6A72" stroke-opacity="0.65"></rect><text x="1071.5" y="457.0" font-size="14" fill="#EEE9DC" font-weight="600" text-anchor="middle">Leave</text><rect x="1190" y="348" width="337" height="42" fill="#D9947E" rx="10" stroke-opacity="0.65"></rect><g transform="translate(1204 361.0) scale(1)"><path d="M8 1 16 15H0Z" fill="none" stroke="#171F29" stroke-width="1.5"></path><line x1="8" y1="5" x2="8" y2="10" stroke="#171F29" stroke-width="2"></line><ellipse cx="8" cy="12" rx="1" ry="1" fill="#171F29"></ellipse></g><text x="1230" y="374.0" font-size="14" fill="#171F29" font-weight="600" text-anchor="start">Report body</text><rect x="1190" y="405" width="337" height="42" fill="#24313C" rx="10" stroke="#5B6A72" stroke-opacity="0.65"></rect><g transform="translate(1204 418.0) scale(1)"><path d="M2 8 6 12 14 3" fill="none" stroke="#EEE9DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="1230" y="431.0" font-size="14" fill="#EEE9DC" font-weight="600" text-anchor="start">Ballot submitted</text><rect x="1190" y="469" width="158" height="27" fill="#5D5140" rx="13"></rect><text x="1269.0" y="487" font-size="12" fill="#E9C781" font-weight="600" text-anchor="middle">RECONNECTING</text><rect x="1360" y="469" width="167" height="27" fill="#35434C" rx="13"></rect><text x="1443.5" y="487" font-size="12" fill="#EEE9DC" font-weight="600" text-anchor="middle">YOU ARE DEAD</text><text x="38" y="559" font-size="12" fill="#95B6A4" font-weight="600" letter-spacing="1.5">03  MOTION &amp; SOUND</text><line x1="38" y1="584" x2="208" y2="584" stroke="#5B6A72" stroke-width="2"></line><ellipse cx="48" cy="584" rx="4" ry="4" fill="#D9947E"></ellipse><text x="38" y="619" font-size="26" fill="#EEE9DC" font-weight="500">120ms</text><text x="38" y="646" font-size="14" fill="#B5C0C2" font-weight="400">Hover / focus</text><line x1="238" y1="584" x2="408" y2="584" stroke="#5B6A72" stroke-width="2"></line><ellipse cx="248" cy="584" rx="4" ry="4" fill="#D9947E"></ellipse><text x="238" y="619" font-size="26" fill="#EEE9DC" font-weight="500">180ms</text><text x="238" y="646" font-size="14" fill="#B5C0C2" font-weight="400">Panel entrance</text><line x1="438" y1="584" x2="608" y2="584" stroke="#5B6A72" stroke-width="2"></line><ellipse cx="448" cy="584" rx="4" ry="4" fill="#D9947E"></ellipse><text x="438" y="619" font-size="26" fill="#EEE9DC" font-weight="500">240ms</text><text x="438" y="646" font-size="14" fill="#B5C0C2" font-weight="400">Meeting dim</text><line x1="638" y1="584" x2="808" y2="584" stroke="#5B6A72" stroke-width="2"></line><ellipse cx="648" cy="584" rx="4" ry="4" fill="#D9947E"></ellipse><text x="638" y="619" font-size="26" fill="#EEE9DC" font-weight="500">640ms</text><text x="638" y="646" font-size="14" fill="#B5C0C2" font-weight="400">Kill gesture</text><text x="883" y="568" font-size="15" fill="#B5C0C2" font-weight="400">Dry felt steps. Muted ceramic impacts.</text><text x="883" y="594" font-size="15" fill="#B5C0C2" font-weight="400">Three soft tones for a phase transition.</text><text x="883" y="620" font-size="15" fill="#B5C0C2" font-weight="400">No off-screen event sound or role cue.</text><text x="883" y="646" font-size="15" fill="#B5C0C2" font-weight="400">Reduced motion: opacity only, no shake.</text><line x1="38" y1="697" x2="1562" y2="697" stroke="#5B6A72" stroke-width="1"></line><text x="38" y="734" font-size="12" fill="#95B6A4" font-weight="600" letter-spacing="1.5">UNITY PLAN</text><text x="190" y="734" font-size="15" fill="#EEE9DC" font-weight="400">Sprite atlases + existing motor / UI Toolkit candidate / tinted panels work without blur / no runtime SVG dependency</text><text x="38" y="771" font-size="13" fill="#B5C0C2" font-weight="400">Concept renders only. No Unity integration, rendered gameplay, platform performance or interaction acceptance is claimed.</text></g></svg>