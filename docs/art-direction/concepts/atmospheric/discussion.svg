><g transform="translate(44 233) scale(0.75)"><rect x="2" y="2" width="12" height="12" fill="#95B6A4" rx="1"></rect></g><text x="68" y="245" font-size="15" fill="#EEE9DC" font-weight="600">Rowan</text><text x="68" y="265" font-size="12" fill="#B5C0C2" font-weight="400">Alive</text><g transform="translate(44 306) scale(0.75)"><ellipse cx="8" cy="8" rx="3" ry="3" fill="#A7ACC9"></ellipse></g><text x="68" y="318" font-size="15" fill="#EEE9DC" font-weight="600">Vale</text><text x="68" y="338" font-size="12" fill="#B5C0C2" font-weight="400">Eliminated</text><line x1="44" y1="313" x2="56" y2="313" stroke="#B5C0C2" stroke-width="1.5"></line><g transform="translate(44 379) scale(0.75)"><polygon points="8,0 16,8 8,16 0,8" fill="#E9C781"></polygon></g><text x="68" y="391" font-size="15" fill="#EEE9DC" font-weight="600">Ivo</text><text x="68" y="411" font-size="12" fill="#B5C0C2" font-weight="400">Alive</text><rect x="254" y="126" width="1" height="345" fill="#52616B" rx="0" opacity="0.55"></rect><g transform="translate(279 142) scale(0.55)"><polygon points="8,0 16,8 8,16 0,8" fill="#D9947E"></polygon></g><text x="302" y="152" font-size="11" fill="#D9947E" font-weight="600" letter-spacing="1">MIRA</text><text x="279" y="179" font-size="15" fill="#EEE9DC" font-weight="400">I found Vale in the east corridor.</text><text x="279" y="201" font-size="15" fill="#EEE9DC" font-weight="400">I did not see who was there before.</text><text x="279" y="228" font-size="12" fill="#B5C0C2" font-weight="400">Your message · accepted by server</text><g transform="translate(279 264) scale(0.55)"><polygon points="8,0 16,8 8,16 0,8" fill="#95B6A4"></polygon></g><text x="302" y="274" font-size="11" fill="#95B6A4" font-weight="600" letter-spacing="1">ROWAN</text><text x="279" y="301" font-size="15" fill="#EEE9DC" font-weight="400">I passed Storage. Did anyone see</text><text x="279" y="323" font-size="15" fill="#EEE9DC" font-weight="400">the corridor during that time?</text><text x="279" y="350" font-size="12" fill="#B5C0C2" font-weight="400">Player statement</text><g transform="translate(279 386) scale(0.55)"><polygon points="8,0 16,8 8,16 0,8" fill="#E9C781"></polygon></g><text x="302" y="396" font-size="11" fill="#E9C781" font-weight="600" letter-spacing="1">IVO</text><text x="279" y="423" font-size="15" fill="#EEE9DC" font-weight="400">I was in Engineering. That is all</text><text x="279" y="445" font-size="15" fill="#EEE9DC" font-weight="400">I can confirm.</text><text x="279" y="472" font-size="12" fill="#B5C0C2" font-weight="400">Player statement</text><rect x="44" y="497" width="583" height="57" fill="#17252F" rx="11" stroke="#5B6A72"></rect><text x="62" y="522" font-size="11" fill="#B5C0C2" font-weight="400">Discussion · Everyone in this meeting</text><text x="62" y="544" font-size="15" fill="#EEE9DC" font-weight="400">Write a message…</text><rect x="640" y="497" width="116" height="57" fill="#D9947E" rx="10" stroke-opacity="0.65"></rect><g transform="translate(654 517.5) scale(1)"><path d="M1 8H15M10 3 15 8 10 13" fill="none" stroke="#171F29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="680" y="530.5" font-size="14" fill="#171F29" font-weight="600" text-anchor="start">Send</text></g></svg>