<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" font-family="Arial, sans-serif"><defs>
        <linearGradient id="system-bg" x2="1" y2="1"><stop stop-color="#193341"/><stop offset="1" stop-color="#08131c"/></linearGradient>
        <linearGradient id="system-floor" x2="0.3" y2="1"><stop stop-color="#698591"/><stop offset="1" stop-color="#334d5c"/></linearGradient>
        <linearGradient id="system-metal" x2="0.4" y2="1"><stop stop-color="#e4eef0"/><stop offset=".5" stop-color="#b2cbd4"/><stop offset="1" stop-color="#7896a6"/></linearGradient>
        <linearGradient id="system-glass" x2=".3" y2="1"><stop stop-color="#304f60" stop-opacity=".97"/><stop offset="1" stop-color="#152a38" stop-opacity=".98"/></linearGradient>
        <linearGradient id="system-window" x2=".9" y2="1"><stop stop-color="#133b4c"/><stop offset="1" stop-color="#081b2a"/></linearGradient>
        <radialGradient id="system-glow"><stop stop-color="#a7f0df" stop-opacity=".27"/><stop offset="1" stop-color="#8adbd1" stop-opacity="0"/></radialGradient>
        <radialGradient id="system-fog" gradientUnits="userSpaceOnUse" cx="410" cy="355" r="480"><stop offset=".32" stop-color="#08131d" stop-opacity="0"/><stop offset=".64" stop-color="#08131d" stop-opacity=".10"/><stop offset="1" stop-color="#08131d" stop-opacity=".92"/></radialGradient>
        </defs><g stroke-linejoin="round"><rect x="0" y="0" width="1600" height="1050" rx="0" fill="url(#system-bg)" stroke="none" stroke-width="1" opacity="1"/><text x="40" y="49" font-size="34" fill="#f2f5ed" font-weight="600" letter-spacing="1" text-anchor="start">LUMINOUS STATION</text><text x="40" y="80" font-size="17" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Ceramic ribs / blue mineral floors / light folded into architecture</text><rect x="40" y="113" width="149" height="65" rx="9" fill="#09151e" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="40" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Void</text><text x="40" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#09151E</text><rect x="211" y="113" width="149" height="65" rx="9" fill="#142937" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="211" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Ink</text><text x="211" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#142937</text><rect x="382" y="113" width="149" height="65" rx="9" fill="#203947" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="382" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Hull</text><text x="382" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#203947</text><rect x="553" y="113" width="149" height="65" rx="9" fill="#718f9e" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="553" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Slate</text><text x="553" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#718F9E</text><rect x="724" y="113" width="149" height="65" rx="9" fill="#d4e4e9" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="724" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Frost</text><text x="724" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#D4E4E9</text><rect x="895" y="113" width="149" height="65" rx="9" fill="#9be3d8" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="895" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Signal</text><text x="895" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#9BE3D8</text><rect x="1066" y="113" width="149" height="65" rx="9" fill="#e6ba7e" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="1066" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Warmth</text><text x="1066" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#E6BA7E</text><rect x="1237" y="113" width="149" height="65" rx="9" fill="#b7b9e8" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="1237" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Archive</text><text x="1237" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#B7B9E8</text><rect x="1408" y="113" width="149" height="65" rx="9" fill="#e39a98" stroke="#7897a6" stroke-width="0.5" opacity="1"/><text x="1408" y="203" font-size="15" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">Warning</text><text x="1408" y="225" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">#E39A98</text><rect x="34" y="262" width="748" height="350" rx="14" fill="#09151e" stroke="none" stroke-width="1" opacity="0.35"/><rect x="34" y="255" width="748" height="350" rx="14" fill="url(#system-glass)" stroke="#668a9b" stroke-width="0.8" opacity="1"/><polyline points="50,256 766,256" fill="none" stroke="#d4e4e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.23"/><text x="58" y="293" font-size="24" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="start">Typography / humanist, not ornamental</text><text x="58" y="344" font-size="36" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="start">Meet the crew.</text><text x="58" y="382" font-size="22" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">01  Exploration / Main Hall</text><text x="58" y="417" font-size="16" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">A clear line is stronger than another glowing panel.</text><text x="58" y="450" font-size="16" fill="#d4e4e9" font-weight="400" letter-spacing="0" text-anchor="start">Русский текст: наблюдение ≠ утверждение</text><text x="58" y="484" font-size="14" fill="#9be3d8" font-weight="600" letter-spacing="0" text-anchor="start">UI body 16 / labels 13 / status 12 / title 32–40</text><text x="58" y="521" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Prototype: installed Arial, no font binaries redistributed.</text><text x="58" y="547" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Production candidate: Noto Sans + Noto Sans Mono, OFL audit</text><text x="58" y="570" font-size="13" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">and glyph/render checks required before shipping.</text><rect x="802" y="262" width="762" height="350" rx="14" fill="#09151e" stroke="none" stroke-width="1" opacity="0.35"/><rect x="802" y="255" width="762" height="350" rx="14" fill="url(#system-glass)" stroke="#668a9b" stroke-width="0.8" opacity="1"/><polyline points="818,256 1548,256" fill="none" stroke="#d4e4e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.23"/><text x="826" y="293" font-size="24" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="start">Components / glass with a firm edge</text><rect x="826" y="320" width="208" height="40" rx="10" fill="#9be3d8" stroke="#628494" stroke-width="0.9" opacity="1"/><text x="930.0" y="345" font-size="14" fill="#142937" font-weight="600" letter-spacing="0" text-anchor="middle">Primary action</text><rect x="1048" y="320" width="208" height="40" rx="10" fill="#1b3444" stroke="#628494" stroke-width="0.9" opacity="1"/><text x="1152.0" y="345" font-size="14" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="middle">Secondary</text><rect x="1270" y="320" width="264" height="40" rx="10" fill="#375363" stroke="#9be3d8" stroke-width="0.9" opacity="1"/><text x="1402.0" y="345" font-size="14" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="middle">Selected</text><rect x="826" y="382" width="370" height="45" rx="10" fill="#102a3a" stroke="#9be3d8" stroke-width="1.5" opacity="1"/><text x="843" y="410" font-size="16" fill="#f2f5ed" font-weight="400" letter-spacing="0" text-anchor="start">Focused input |</text><rect x="1215" y="382" width="319" height="45" rx="10" fill="#1d3544" stroke="#4d6b7d" stroke-width="1" opacity="1"/><text x="1374" y="410" font-size="15" fill="#718f9e" font-weight="600" letter-spacing="0" text-anchor="middle">Unavailable</text><rect x="826" y="450" width="74.30000000000001" height="23" rx="7" fill="#142937" stroke="#9be3d8" stroke-width="0.8" opacity="1"/><text x="834" y="466" font-size="11" fill="#9be3d8" font-weight="600" letter-spacing="0" text-anchor="start">DELIVERED</text><rect x="947" y="450" width="67.6" height="23" rx="7" fill="#142937" stroke="#e6ba7e" stroke-width="0.8" opacity="1"/><text x="955" y="466" font-size="11" fill="#e6ba7e" font-weight="600" letter-spacing="0" text-anchor="start">COOLDOWN</text><rect x="1080" y="450" width="87.7" height="23" rx="7" fill="#142937" stroke="#a8bec9" stroke-width="0.8" opacity="1"/><text x="1088" y="466" font-size="11" fill="#a8bec9" font-weight="600" letter-spacing="0" text-anchor="start">OUT OF PLAY</text><rect x="1223" y="450" width="101.10000000000001" height="23" rx="7" fill="#142937" stroke="#d4e4e9" stroke-width="0.8" opacity="1"/><text x="1231" y="466" font-size="11" fill="#d4e4e9" font-weight="600" letter-spacing="0" text-anchor="start">BALLOT LOCKED</text><text x="826" y="510" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Spacing 8 / 12 / 20 / 32 · radius 10 / 14 · controls ≥40 px</text><text x="826" y="543" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">76–96% tinted fill, 1 px rim, restrained top reflection.</text><text x="826" y="576" font-size="15" fill="#9be3d8" font-weight="600" letter-spacing="0" text-anchor="start">Blur is optional. High-contrast fallback is the baseline.</text><rect x="34" y="639" width="748" height="365" rx="14" fill="#09151e" stroke="none" stroke-width="1" opacity="0.35"/><rect x="34" y="632" width="748" height="365" rx="14" fill="url(#system-glass)" stroke="#668a9b" stroke-width="0.8" opacity="1"/><polyline points="50,633 766,633" fill="none" stroke="#d4e4e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.23"/><text x="58" y="672" font-size="24" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="start">One station / four silhouettes</text><rect x="61" y="709" width="326" height="103" rx="10" fill="#2d4a5b" stroke="#7e9aa7" stroke-width="1" opacity="1"/><g transform="translate(100 754) scale(0.7)"><polygon points="0,-26 21,-1 0,25 -21,0" fill="#9be3d8" stroke="none" stroke-width="1" stroke-linejoin="round" opacity="1"/><polygon points="0,-26 0,25 -21,0" fill="#eef9ed" stroke="none" stroke-width="1" stroke-linejoin="round" opacity="0.88"/><polygon points="0,-26 21,-1 0,3" fill="#b5e1de" stroke="none" stroke-width="1" stroke-linejoin="round" opacity="1"/><polyline points="0,-26 0,25 21,-1" fill="none" stroke="#f1fff5" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g><text x="143" y="748" font-size="13" fill="#f2f5ed" font-weight="600" letter-spacing="1" text-anchor="start">MAIN HALL</text><text x="143" y="774" font-size="12" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Light well / radial inlay</text><rect x="419" y="709" width="326" height="103" rx="10" fill="#2d4a5b" stroke="#7e9aa7" stroke-width="1" opacity="1"/><ellipse cx="458" cy="755" rx="24" ry="18" fill="none" stroke="#e6ba7e" stroke-width="5" opacity="1"/><polyline points="442,739 474,771" fill="none" stroke="#e6ba7e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="501" y="748" font-size="13" fill="#f2f5ed" font-weight="600" letter-spacing="1" text-anchor="start">ENGINEERING</text><text x="501" y="774" font-size="12" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Thermal ribs / solid reactor</text><rect x="61" y="839" width="326" height="103" rx="10" fill="#2d4a5b" stroke="#7e9aa7" stroke-width="1" opacity="1"/><rect x="81" y="863" width="9" height="43" rx="2" fill="#b7b9e8" stroke="none" stroke-width="1" opacity="0.7"/><rect x="96" y="863" width="9" height="43" rx="2" fill="#b7b9e8" stroke="none" stroke-width="1" opacity="0.7"/><rect x="111" y="863" width="9" height="43" rx="2" fill="#b7b9e8" stroke="none" stroke-width="1" opacity="0.7"/><text x="143" y="878" font-size="13" fill="#f2f5ed" font-weight="600" letter-spacing="1" text-anchor="start">SECURITY</text><text x="143" y="904" font-size="12" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Vertical archives / glass</text><rect x="419" y="839" width="326" height="103" rx="10" fill="#2d4a5b" stroke="#7e9aa7" stroke-width="1" opacity="1"/><rect x="434" y="877" width="23" height="20" rx="3" fill="#d4e4e9" stroke="#183644" stroke-width="2" opacity="1"/><rect x="458" y="877" width="23" height="20" rx="3" fill="#d4e4e9" stroke="#183644" stroke-width="2" opacity="1"/><rect x="446" y="857" width="23" height="20" rx="3" fill="#d4e4e9" stroke="#183644" stroke-width="2" opacity="1"/><text x="501" y="878" font-size="13" fill="#f2f5ed" font-weight="600" letter-spacing="1" text-anchor="start">STORAGE</text><text x="501" y="904" font-size="12" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Low cassettes / warm straps</text><rect x="802" y="639" width="762" height="365" rx="14" fill="#09151e" stroke="none" stroke-width="1" opacity="0.35"/><rect x="802" y="632" width="762" height="365" rx="14" fill="url(#system-glass)" stroke="#668a9b" stroke-width="0.8" opacity="1"/><polyline points="818,633 1548,633" fill="none" stroke="#d4e4e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.23"/><text x="826" y="672" font-size="24" fill="#f2f5ed" font-weight="600" letter-spacing="0" text-anchor="start">Unity production contract</text><text x="826" y="712" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Original vector master → deterministic 2× PNG atlas.</text><text x="826" y="744" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Shared 50 PPU world art; 8-direction pivots stay fixed.</text><text x="826" y="776" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">SpriteRenderer / URP 2D; wall, floor and emissive layers separate.</text><text x="826" y="808" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">No new collider inferred from a decorative pixel or glow.</text><text x="826" y="840" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">UI Toolkit views consume existing permitted ViewModels.</text><text x="826" y="872" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Blur spike must pass 800×600 rendered FPS + fallback tests.</text><text x="826" y="904" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">No remote event can light a lamp, animate or sound outside sight.</text><text x="826" y="936" font-size="15" fill="#a8bec9" font-weight="400" letter-spacing="0" text-anchor="start">Sandbox original art remains isolated from Social redesign.</text></g></svg>