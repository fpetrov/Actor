<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Quiet Industrial concept: design-system"><defs>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#2c4249" stop-opacity=".97"/><stop offset="1" stop-color="#14272e" stop-opacity=".96"/></linearGradient>
<linearGradient id="floor" x2="1" y2="1"><stop stop-color="#73817a"/><stop offset="1" stop-color="#4f6464"/></linearGradient>
<radialGradient id="pool"><stop stop-color="#e3c38b" stop-opacity=".20"/><stop offset="1" stop-color="#e3c38b" stop-opacity="0"/></radialGradient>
<pattern id="grate" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#24383d"/><path d="M0 4H8" stroke="#506369" stroke-width="1.4"/></pattern>
<pattern id="floorgrid" width="88" height="74" patternUnits="userSpaceOnUse"><rect width="88" height="74" fill="url(#floor)"/><path d="M0 0H88V74" fill="none" stroke="#9aa69b" stroke-opacity=".23"/><path d="M2 73H86" stroke="#233e43" stroke-opacity=".25"/></pattern>
</defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#101a20" stroke="none" stroke-width="1" opacity="1"/><text x="32" y="47" fill="#eae4cf" font-family="Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="1.5">QUIET INDUSTRIAL / MATERIAL &amp; INTERFACE SYSTEM</text><rect x="32" y="77" width="128" height="65" rx="8" fill="#101a20" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="32" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">VOID</text><text x="32" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#101a20</text><rect x="178" y="77" width="128" height="65" rx="8" fill="#24343b" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="178" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">GRAPHITE</text><text x="178" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#24343b</text><rect x="324" y="77" width="128" height="65" rx="8" fill="#657572" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="324" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">FLOOR</text><text x="324" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#657572</text><rect x="470" y="77" width="128" height="65" rx="8" fill="#eae4cf" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="470" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">PAPER</text><text x="470" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#eae4cf</text><rect x="616" y="77" width="128" height="65" rx="8" fill="#e1b16c" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="616" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">AMBER</text><text x="616" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#e1b16c</text><rect x="762" y="77" width="128" height="65" rx="8" fill="#8dbdb3" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="762" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">SEA GLASS</text><text x="762" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#8dbdb3</text><rect x="908" y="77" width="128" height="65" rx="8" fill="#8daebe" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="908" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">SLATE</text><text x="908" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#8daebe</text><rect x="1054" y="77" width="128" height="65" rx="8" fill="#d68f7f" stroke="#6b7e7d" stroke-width="0.5" opacity="1"/><text x="1054" y="164" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.8">ALERT</text><text x="1054" y="186" fill="#eae4cf" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">#d68f7f</text><path d="M32 211L1168 211" fill="none" stroke="#41545a" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="32" y="247" fill="#e1b16c" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.5">01 / TYPOGRAPHY</text><text x="32" y="295" fill="#eae4cf" font-family="Arial,sans-serif" font-size="32" font-weight="600" text-anchor="start" letter-spacing="0">A quiet working station.</text><text x="32" y="328" fill="#eae4cf" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Readable language before technical decoration.</text><text x="32" y="356" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Main Hall / Главный зал / Shift 07</text><text x="32" y="388" fill="#8dbdb3" font-family="Courier New,monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">00:39  /  4 OF 6 READY</text><text x="648" y="264" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Production target: Noto Sans + Noto Sans Mono, OFL.</text><text x="648" y="291" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Concept previews use portable Arial / Courier fallbacks.</text><text x="648" y="318" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">32 title · 22 section · 16 body · 14 secondary · 12 labels.</text><text x="648" y="345" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Cyrillic/Latin/IME must be tested with real font assets.</text><text x="648" y="372" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Avoid labels below 12 px in the shipped 800×600 UI.</text><path d="M32 419L1168 419" fill="none" stroke="#41545a" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="32" y="452" fill="#e1b16c" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.5">02 / COMPONENTS</text><rect x="32" y="478" width="173" height="40" rx="8" fill="#e1b16c" stroke="#eed0a0" stroke-width="0.8" opacity="1"/><text x="118.5" y="503" fill="#101a20" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0">Continue</text><rect x="221" y="478" width="173" height="40" rx="8" fill="#2a3e45" stroke="#5c7379" stroke-width="0.8" opacity="1"/><text x="307.5" y="503" fill="#f0eddf" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0">Secondary</text><rect x="410" y="478" width="173" height="40" rx="8" fill="#26373d" stroke="#5c7379" stroke-width="0.8" opacity="0.5"/><text x="496.5" y="503" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0">Unavailable</text><rect x="32" y="542" width="551" height="48" rx="8" fill="#192d34" stroke="#e1b16c" stroke-width="2" opacity="1"/><text x="48" y="572" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Message the discussion…</text><rect x="648" y="470" width="520" height="140" rx="12" fill="#071116" stroke="none" stroke-width="1" opacity="0.3"/><rect x="648" y="465" width="520" height="140" rx="12" fill="url(#glass)" stroke="#758e90" stroke-width="0.8" opacity="1"/><path d="M660 466L1156 466" fill="none" stroke="#d6e2d9" stroke-width="0.7" stroke-linecap="round" opacity="0.28"/><text x="668" y="493" fill="#e1b16c" font-family="Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">SMOKED GLASS</text><text x="668" y="523" fill="#eae4cf" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">94% dark body + restrained top highlight</text><text x="668" y="549" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">8–12 px blur only behind large stationary surfaces.</text><text x="668" y="578" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Low quality: opaque tint; text contrast unchanged.</text><path d="M32 637L1168 637" fill="none" stroke="#41545a" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="32" y="674" fill="#e1b16c" font-family="Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.5">03 / SHAPE &amp; MOTION</text><text x="32" y="713" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">8 px control radius / 12 px panels / 16 px large dialogs.</text><text x="32" y="743" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">8 px spacing unit · 24 px screen safe margin · 40 px buttons.</text><text x="32" y="773" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">World edges: chamfered steel, 2–3 layered bevel bands.</text><text x="32" y="803" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">UI hover 80 ms · press 60 ms · panel 160 ms · phase 240 ms.</text><text x="648" y="713" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Not every surface glows. Amber is a signal, not a room fill.</text><text x="648" y="743" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Character and corpse keep the brightest local silhouettes.</text><text x="648" y="773" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">UI never reads server authority or hidden remote state.</text><text x="648" y="803" fill="#a9b9b5" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Reduced motion removes travel/overshoot, keeps status text.</text></svg>