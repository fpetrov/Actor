syntax = "proto3";

package actor.extensions.agents_arena.v1;
option csharp_namespace = "AgentsArena.ActorProtocol.V1";

// Public station duties. Future hidden affiliations must use separate private
// payloads; they must never be added to the public duty roster implicitly.
enum CrewRole {
  CREW_ROLE_UNSPECIFIED = 0;
  CREW_ROLE_CREW = 1;
  CREW_ROLE_ENGINEER = 2;
  CREW_ROLE_SHERIFF = 3;
}

enum CoolingStatus {
  COOLING_STATUS_UNSPECIFIED = 0;
  COOLING_STATUS_OPERATIONAL = 1;
  COOLING_STATUS_FAILURE = 2;
  COOLING_STATUS_REPAIRING = 3;
  COOLING_STATUS_RESTORED = 4;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_NONE = 1;
  INCIDENT_STATUS_ACTIVE = 2;
  INCIDENT_STATUS_RESOLVED = 3;
  INCIDENT_STATUS_EXPIRED = 4;
  INCIDENT_STATUS_CANCELLED = 5;
  INCIDENT_STATUS_FAILED = 6;
}

enum CoolingSeverity {
  COOLING_SEVERITY_UNSPECIFIED = 0;
  COOLING_SEVERITY_NORMAL = 1;
  COOLING_SEVERITY_ELEVATED = 2;
}

// This is a report hypothesis, not a public or private server-answer field.
enum ProposedOrigin {
  PROPOSED_ORIGIN_UNSPECIFIED = 0;
  PROPOSED_ORIGIN_MECHANICAL_FAILURE = 1;
  PROPOSED_ORIGIN_MANUAL_INTERFERENCE = 2;
  PROPOSED_ORIGIN_INSUFFICIENT_EVIDENCE = 3;
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_ACCESS = 1;
  AUDIT_ACTION_INSPECT = 2;
  AUDIT_ACTION_FLOW_ADJUSTMENT = 3;
  AUDIT_ACTION_CONTROLLER_CHECK = 4;
}

enum EvidenceVisibility {
  EVIDENCE_VISIBILITY_UNSPECIFIED = 0;
  EVIDENCE_VISIBILITY_ROLE_PRIVATE = 1;
}

enum IncidentAction {
  INCIDENT_ACTION_UNSPECIFIED = 0;
  INCIDENT_ACTION_MAINTENANCE_OVERRIDE = 1;
  INCIDENT_ACTION_CANCEL_REPAIR = 2;
  INCIDENT_ACTION_CANCEL_INVESTIGATION = 3;
}

message OwnRoleObservation {
  string actor_id = 1;
  CrewRole role = 2;
  bool selection_locked = 3;
  string match_id = 4;
  uint64 server_revision = 5;
}

message DutyRoleEntry {
  string actor_id = 1;
  string display_name = 2;
  CrewRole role = 3;
}

message DutyRosterObservation {
  repeated DutyRoleEntry entries = 1;
  string match_id = 2;
  uint64 server_revision = 3;
}

message SelectRoleCommand {
  CrewRole role = 1;
  string correlation_id = 2;
  string match_id = 3;
}

message RoleResultEvent {
  string correlation_id = 1;
  bool accepted = 2;
  string reason_code = 3;
  OwnRoleObservation state = 4;
  string match_id = 5;
  uint64 server_revision = 6;
}

// Identical public structure for both origins. No cause, evidence identity,
// exact fault window, diagnostic trace, or private audit record belongs here.
// detected_at is the public alarm time, not the hidden precise fault instant.
message CoolingStateObservation {
  string incident_id = 1;
  CoolingStatus cooling_status = 2;
  IncidentStatus incident_status = 3;
  CoolingSeverity severity = 4;
  string location_id = 5;
  int64 detected_at_unix_ms = 6;
  int64 expires_at_unix_ms = 7;
  bool report_validated = 8;
  int64 repair_completes_at_unix_ms = 9;
  uint64 server_revision = 10;
  string match_id = 11;
  string reason_code = 12;
}

message IncidentStartedEvent {
  CoolingStateObservation state = 1;
}

message IncidentChangedEvent {
  CoolingStateObservation state = 1;
}

// Evidence identities are generated by the server and scoped to this match,
// incident, source and authorized role holder. Forwarded text is still a player
// claim, never a newly observed authoritative source at the receiving Runtime.
message EvidenceProvenance {
  string evidence_id = 1;
  string incident_id = 2;
  string source_entity_id = 3;
  int64 observed_at_unix_ms = 4;
  int64 expires_at_unix_ms = 5;
  uint64 server_revision = 6;
  string match_id = 7;
  string recipient_actor_id = 8;
  CrewRole recipient_role = 9;
  EvidenceVisibility visibility = 10;
}

message PressureSample {
  int64 at_unix_ms = 1;
  double pressure = 2;
}

// At most eight finite samples and wear in [0,1]. Neither wear nor one pressure
// pattern may encode the origin directly; paired scenarios retain ambiguity.
message DiagnosticEvidence {
  EvidenceProvenance provenance = 1;
  string circuit_ref = 2;
  int64 failure_window_start_unix_ms = 3;
  int64 failure_window_end_unix_ms = 4;
  repeated PressureSample samples = 5;
  double equipment_wear = 6;
  uint64 controller_revision_before = 7;
  uint64 controller_revision_after = 8;
}

message MaintenanceRecord {
  string record_id = 1;
  string source_entity_id = 2;
  string circuit_ref = 3;
  int64 window_start_unix_ms = 4;
  int64 window_end_unix_ms = 5;
  AuditAction action = 6;
  // Present only for an actor actually observed performing this interaction.
  // Seeded controller history must not impersonate an approved player.
  string actor_id = 7;
  bool interaction_confirmed = 8;
  uint64 prior_controller_revision = 9;
  uint64 resulting_controller_revision = 10;
}

message SecurityEvidence {
  EvidenceProvenance provenance = 1;
  // At most six authorized records, not the dedicated server's complete log.
  repeated MaintenanceRecord records = 2;
  // Absence is meaningful only inside this complete, bounded coverage. A view
  // must never claim completeness after silently truncating qualifying records.
  int64 coverage_window_start_unix_ms = 3;
  int64 coverage_window_end_unix_ms = 4;
  bool complete_for_listed_circuits = 5;
  // At most two authorized circuit references (alpha/beta in this reference game).
  repeated string circuit_refs = 6;
}

// Owner-targeted retained view of legitimately inspected evidence. An explicit
// empty evidence oneof clears the old view; omission from a frame does not.
// The installed Runtime policy marks this observation session_only and applies
// the top-level expiry without needing knowledge of game-specific nested data.
message OwnInvestigationViewObservation {
  string recipient_actor_id = 1;
  string incident_id = 2;
  string match_id = 3;
  uint64 server_revision = 4;
  oneof evidence {
    DiagnosticEvidence diagnostic = 5;
    SecurityEvidence security = 6;
  }
  int64 expires_at_unix_ms = 7;
}

message InspectCoolingCommand {
  string incident_id = 1;
  string correlation_id = 2;
  string match_id = 3;
}

message InspectSecurityRecordsCommand {
  string incident_id = 1;
  string correlation_id = 2;
  string match_id = 3;
}

// Private requesting Engineer only. Correlation identity distinguishes a valid
// repeat inspection returning the same stable evidence ID from a wire replay.
message DiagnosticEvidenceEvent {
  string correlation_id = 1;
  bool accepted = 2;
  string reason_code = 3;
  DiagnosticEvidence evidence = 4;
  string match_id = 5;
  int64 expires_at_unix_ms = 6;
  string recipient_actor_id = 7;
  uint64 server_revision = 8;
}

message SecurityEvidenceEvent {
  string correlation_id = 1;
  bool accepted = 2;
  string reason_code = 3;
  SecurityEvidence evidence = 4;
  string match_id = 5;
  int64 expires_at_unix_ms = 6;
  string recipient_actor_id = 7;
  uint64 server_revision = 8;
}

message RepairCoolingCommand {
  string incident_id = 1;
  string diagnostic_evidence_id = 2;
  string correlation_id = 3;
  string match_id = 4;
}

message CancelCoolingRepairCommand {
  string incident_id = 1;
  string correlation_id = 2;
  string match_id = 3;
}

message CancelInvestigationCommand {
  string incident_id = 1;
  string correlation_id = 2;
  string match_id = 3;
}

// alpha/beta are public controls. The caller cannot set an incident origin;
// the authoritative active/standby circuit state determines the actual effect.
message MaintenanceOverrideCommand {
  string circuit_ref = 1;
  string correlation_id = 2;
  string match_id = 3;
}

message SubmitInvestigationReportCommand {
  string incident_id = 1;
  ProposedOrigin proposed_origin = 2;
  // Exactly three references in the Arena MVP: the issued Diagnostic EvidenceId,
  // issued Security EvidenceId, and one MaintenanceRecord.RecordId in that view.
  // The server checks their kinds, incident and correspondence; cross-role
  // disclosure additionally requires actual direct receiving-client ACK.
  repeated string supporting_evidence_ids = 3;
  string explanation = 4;
  string correlation_id = 5;
  string match_id = 6;
}

// Acceptance may mean a repair lease started. Only completed=true confirms
// physical repair. Start/completion share a correlation; inbox dedup must retain
// both stages, rather than suppressing completion by correlation alone.
message RepairResultEvent {
  string correlation_id = 1;
  bool accepted = 2;
  string reason_code = 3;
  string incident_id = 4;
  bool completed = 5;
  CoolingStatus cooling_status = 6;
  IncidentStatus incident_status = 7;
  uint64 server_revision = 8;
  string match_id = 9;
}

// Wrong reports never disclose the correct origin. InsufficientEvidence is a
// bounded non-resolving submission, not a successful investigation classification.
message InvestigationResultEvent {
  string correlation_id = 1;
  bool accepted = 2;
  string reason_code = 3;
  string incident_id = 4;
  bool report_validated = 5;
  IncidentStatus incident_status = 6;
  uint64 server_revision = 7;
  string match_id = 8;
}

message IncidentActionResultEvent {
  string correlation_id = 1;
  IncidentAction action = 2;
  bool accepted = 3;
  string reason_code = 4;
  string incident_id = 5;
  CoolingStatus cooling_status = 6;
  IncidentStatus incident_status = 7;
  uint64 server_revision = 8;
  string match_id = 9;
}
