name: ACTOR SDK and Runtime
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  protocol-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Generated schema freshness
        run: scripts/generate-proto.sh --check
      - name: SDK and Control Plane tests
        run: dotnet test Actor.sln --configuration Release --nologo
      - name: Install local Runtime and extension packages
        run: python -m pip install -e 'runtime[dev]'
      - name: Codex dependency remains optional for deterministic CI
        run: python -c 'import importlib.util; assert importlib.util.find_spec("openai_codex") is None'
      - name: Runtime, Skills, Brains and real loopback gRPC tests
        run: python -m pytest runtime/tests -q
