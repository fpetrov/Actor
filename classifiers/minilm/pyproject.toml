[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actor-minilm-classifier"
version = "0.2.0"
description = "Local MiniLM v7 strategic-review classifier with private decision traces"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE-BASE-MODEL", "THIRD_PARTY_NOTICES.md"]
dependencies = ["torch==2.14.1", "transformers==4.57.6", "pydantic==2.14.1", "numpy==2.5.4"]

[project.optional-dependencies]
runtime = ["actor-runtime==0.8.0"]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[project.scripts]
actor-minilm = "actor_minilm.cli:main"
actor-minilm-train = "actor_minilm.training:main"
actor-minilm-evaluate = "actor_minilm.evaluation:main"

[project.entry-points."actor.classifiers"]
minilm = "actor_minilm.provider:factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actor_minilm = ["adapter_resources/*.txt", "checkpoints/v7/*.json", "checkpoints/v7/model/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
